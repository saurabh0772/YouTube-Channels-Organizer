services:
  - type: web
    name: youtube-content-hq
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PASSCODE
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_DATABASE_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
